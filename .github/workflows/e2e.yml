name: End-to-end

# Drives a real browser against a deployed copy of the site. It never pays or writes to Sanity, so
# it is safe to point at production. Run it by hand after a deploy, or let the daily schedule act
# as a smoke test. The signed-in tests run only if the three optional secrets below are set
# (repository Settings > Secrets and variables > Actions); without them they are skipped.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://my-farmhouse-pi.vercel.app
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://my-farmhouse-pi.vercel.app' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

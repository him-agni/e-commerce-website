# Weekly pull requests for dependency updates; CI runs on each one. Security fixes for known
# vulnerabilities open separately and immediately (enable Dependabot alerts and security updates in
# the repository's Settings > Advanced Security).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
